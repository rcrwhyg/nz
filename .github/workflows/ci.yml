name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features --no-tests warn

      - name: Typos
        uses: crate-ci/typos@master
        with:
          config: _typos.toml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (nz-net line ≥95%)
        run: cargo llvm-cov -p nz-net --all-features --summary-only --fail-under-lines 95 --lcov --output-path lcov-nz-net.info
      - name: Coverage (nz-arg line ≥95%)
        run: cargo llvm-cov -p nz-arg --all-features --summary-only --fail-under-lines 95 --lcov --output-path lcov-nz-arg.info
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov-nz-net.info,lcov-nz-arg.info
          fail_ci_if_error: false
