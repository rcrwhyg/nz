[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/rcrwhyg/nz"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
thiserror = "2.0.20"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
